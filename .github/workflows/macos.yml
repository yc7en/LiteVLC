name: macOS

# 双架构矩阵：macos-15（真 Apple Silicon）出 arm64，macos-15-intel 出 x86_64（Intel Mac）。
# GitHub 的 macos-13（最后的免费 Intel runner）已于 2025-12 退役；macos-15-intel
# 可用至 2027-08，之后托管 runner 不再有 x86_64（届时需自托管或停止 Intel 构建）。
# 产物是 ad-hoc 签名的 dmg（无 Apple 开发者证书，用户首次打开需右键→打开）。

on:
  push:
    branches: [main]
    # 打 tag（v1.2.3）时也跑一遍，并把 dmg 直接挂到同名 Release 上。
    # 注意：GitHub 对 tag push 不评估 paths 过滤，所以 tag 一定能触发。
    tags: ['v*']
    paths:
      - 'src/**'
      - 'resources/**'
      - 'packaging/**'
      - 'thirdparty/**'
      - 'CMakeLists.txt'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

# 建 Release / 传资产需要写权限
permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.0'
  VLC_VERSION: '3.0.21'

jobs:
  build:
    name: Build ${{ matrix.pkg_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmake_arch: arm64
            pkg_arch: arm64
            runner: macos-15
            vlc_dmg: vlc-3.0.21-arm64.dmg
          - cmake_arch: x86_64
            pkg_arch: x64
            runner: macos-15-intel
            vlc_dmg: vlc-3.0.21-intel64.dmg

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          uname -m
          sw_vers
          xcodebuild -version

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: 下载并挂载 VLC（${{ matrix.pkg_arch }}）
        run: |
          set -uo pipefail
          DMG="${{ matrix.vlc_dmg }}"
          MIRRORS=(
            "https://get.videolan.org/vlc/${VLC_VERSION}/macosx"
            "https://download.videolan.org/pub/videolan/vlc/${VLC_VERSION}/macosx"
          )
          ok=0
          for BASE in "${MIRRORS[@]}"; do
            echo "==> 下载 $BASE/$DMG"
            if curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$DMG" "$BASE/$DMG"; then
              ok=1; break
            fi
            echo "!! 该镜像失败"
          done
          if [ "$ok" != "1" ]; then
            echo "::error title=VLC dmg 下载失败::已尝试 ${MIRRORS[*]}"
            exit 1
          fi
          ls -l "$DMG"

          # sha256 只做完整性校验；官方镜像偶尔不提供 .sha256，拿不到不算致命
          if curl -fsSL --retry 2 --connect-timeout 20 -o "$DMG.sha256" "${MIRRORS[0]}/$DMG.sha256"; then
            EXPECTED="$(awk '{print $1}' "$DMG.sha256")"
            ACTUAL="$(shasum -a 256 "$DMG" | awk '{print $1}')"
            echo "expected=$EXPECTED actual=$ACTUAL"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error title=VLC dmg 校验失败::expected=$EXPECTED actual=$ACTUAL"
              exit 1
            fi
          else
            echo "::warning title=跳过 sha256 校验::拿不到 $DMG.sha256"
          fi

          mkdir -p /tmp/vlc
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint /tmp/vlc || {
            echo "::error title=挂载 VLC dmg 失败::$(hdiutil attach "$DMG" -nobrowse 2>&1 | tail -3)"
            exit 1
          }
          mkdir -p vlc
          cp -a /tmp/vlc/VLC.app vlc/
          hdiutil detach /tmp/vlc -quiet
          lipo -archs vlc/VLC.app/Contents/MacOS/lib/libvlc.dylib

      - name: 读取版本号
        id: ver
        run: |
          VERSION="$(grep -oE 'project\(LiteVlcPlayer VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION"

      - name: 配置
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: 编译
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 编译失败时把错误行转成注解：注解走公开 API 就能读，不用登进 Actions 页面翻日志
      - name: 汇总编译错误
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          MSG="$(grep -vE 'warning:' "$LOG" | grep -E 'error:|fatal error|CMake Error|library not found|Undefined symbols|ld: [^w]|symbol\(s\) not found' | head -10 | tr '\n' '~' | cut -c1-3500)"
          [ -n "$MSG" ] && echo "::error title=macOS 编译失败::${MSG}"
          tail -40 "$LOG"
          exit 0

      - name: 打包 Qt 依赖
        run: |
          APP="build/LiteVlcPlayer.app"
          ls -la "$APP/Contents/MacOS"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -always-overwrite -verbose=1

      - name: 塞入 VLC + 修路径 + ad-hoc 签名
        run: |
          chmod +x packaging/macos/bundle.sh
          packaging/macos/bundle.sh \
            "build/LiteVlcPlayer.app" \
            "vlc/VLC.app/Contents/MacOS" \
            "${{ steps.ver.outputs.version }}" \
            "${{ matrix.pkg_arch }}"

      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: LiteVlcPlayer-macos-${{ matrix.pkg_arch }}
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 14

      # 只有 tag push 才建 Release；两个工作流各自把本端产物挂到同一个 tag 的 Release 上
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true

      - name: 失败时打印 bundle 结构
        if: failure()
        run: |
          find build/LiteVlcPlayer.app -maxdepth 3 | head -50 || true
          otool -L build/LiteVlcPlayer.app/Contents/MacOS/LiteVlcPlayer || true
